name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ODF_DATABASE_URL: sqlite:///./ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate test secrets
        run: |
          echo "ODF_JWT_SECRET=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')" >> "$GITHUB_ENV"
          echo "ODF_FERNET_KEY=$(python -c 'import base64,os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')" >> "$GITHUB_ENV"
      - name: Install
        working-directory: impl
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev,ldap,files-s3]"
      - name: Migrate
        working-directory: impl
        run: alembic upgrade head
      - name: Unit tests
        working-directory: impl
        run: pytest -q
      - name: End-to-end tests
        working-directory: impl
        env:
          ODF_TEST_DATABASE_URL: sqlite:///./ci.db
        run: pytest tests/test_e2e.py -q
      - name: Deployment unit check
        run: sh deploy/tests/test_units.sh

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ODF_DATABASE_URL: sqlite:///./ci.db
      ODF_IT_POSTGRES_URL: postgresql+psycopg://odf:odf@127.0.0.1:55432/odf_it
      ODF_IT_CLICKHOUSE_URL: clickhouse://default:@127.0.0.1:58123/default
      ODF_IT_S3_ENDPOINT: http://127.0.0.1:59010
      ODF_IT_S3_BUCKET: odf-it
      ODF_IT_S3_ACCESS_KEY: odfminio
      ODF_IT_S3_SECRET_KEY: odfminio123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        working-directory: impl
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev,ldap,files-s3]"
      - name: Start services
        run: docker compose -f deploy/integration/docker-compose.yml --profile core up -d --wait --wait-timeout 180
      - name: Integration tests
        working-directory: impl
        run: pytest tests/integration -m integration -q
      - name: Service logs
        if: failure()
        run: docker compose -f deploy/integration/docker-compose.yml --profile core logs --tail 200
      - name: Stop services
        if: always()
        run: docker compose -f deploy/integration/docker-compose.yml --profile core down -v

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend
        working-directory: impl
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser E2E
        working-directory: frontend
        env:
          PYTHON: python
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.15.4
      - name: Lint chart
        run: helm lint deploy/helm/odf
      - name: Render chart
        run: |
          FERNET_KEY=$(python -c 'import base64,os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')
          helm template odf deploy/helm/odf             --set secrets.create=true             --set-string secrets.databaseUrl='postgresql+psycopg://u:p@pg/odf'             --set-string secrets.jwtSecret='test-only-jwt-secret-not-for-production'             --set-string secrets.fernetKey="$FERNET_KEY"             --set backup.enabled=true --set auditPrune.enabled=true > /tmp/odf-rendered.yaml
          test -s /tmp/odf-rendered.yaml
