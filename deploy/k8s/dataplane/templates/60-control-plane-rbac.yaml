apiVersion: v1
kind: ServiceAccount
metadata:
  name: odf-control-plane
  namespace: data
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: odf-control-plane
  namespace: data
rules:
  - apiGroups: ["sparkoperator.k8s.io"]
    resources: ["sparkapplications"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: odf-control-plane
  namespace: data
subjects:
  - kind: ServiceAccount
    name: odf-control-plane
    namespace: data
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: odf-control-plane
---
apiVersion: v1
kind: Secret
metadata:
  name: odf-control-plane-token
  namespace: data
  annotations:
    kubernetes.io/service-account.name: odf-control-plane
type: kubernetes.io/service-account-token
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark-operator-spark
  namespace: data
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-driver-edit
  namespace: data
subjects:
  - kind: ServiceAccount
    name: spark-operator-spark
    namespace: data
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
