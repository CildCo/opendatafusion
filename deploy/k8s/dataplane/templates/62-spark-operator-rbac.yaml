# The Spark Operator chart installs a minimal ClusterRole; it relies on a
# binding in the namespace where applications run. Every namespace this platform
# creates needs those permissions.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: odf-spark-operator
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "secrets", "events",
                "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "delete", "deletecollection",
            "update", "patch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
  - apiGroups: ["sparkoperator.k8s.io"]
    resources: ["sparkapplications", "scheduledsparkapplications",
                "sparkconnects"]
    verbs: ["get", "list", "watch", "create", "delete", "deletecollection",
            "update", "patch"]
  - apiGroups: ["sparkoperator.k8s.io"]
    resources: ["sparkapplications/status", "scheduledsparkapplications/status",
                "sparkconnects/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["extensions", "networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "delete", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: odf-spark-operator
subjects:
  - kind: ServiceAccount
    name: spark-operator-controller
    namespace: spark-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: odf-spark-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: odf-spark-operator-webhook
subjects:
  - kind: ServiceAccount
    name: spark-operator-webhook
    namespace: spark-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: odf-spark-operator
