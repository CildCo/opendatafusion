# Entry points served by the k3s Traefik controller. Certificates come
# from the self-signed ClusterIssuer in 79-certificates.yaml.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trino
  namespace: trino
  annotations:
    cert-manager.io/cluster-issuer: odf-selfsigned
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts: ["${TRINO_HOST}"]
      secretName: trino-tls
  rules:
    - host: ${TRINO_HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: trino
                port:
                  number: 8080
---
