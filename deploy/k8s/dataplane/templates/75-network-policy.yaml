# Spark applications run in the `data` namespace. Deny ingress from other
# namespaces by default, then allow the paths the cluster actually uses.
#
# Egress is left open: drivers and executors reach object storage, the catalog
# and DNS. Tightening egress needs the concrete endpoints of your environment.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: data-default-deny-ingress
  namespace: data
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: spark-operator
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: spark-allow-driver-control
  namespace: data
spec:
  podSelector:
    matchLabels:
      spark-role: driver
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: {}
