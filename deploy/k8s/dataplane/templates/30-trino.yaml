apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-config
  namespace: trino
data:
  node.properties: |
    node.environment=production
    node.data-dir=/data/trino
    node.id=trino-1
  jvm.config: |
    -server
    -Xmx${TRINO_HEAP}
    -XX:+UseG1GC
    -XX:G1HeapRegionSize=32M
    -XX:+ExplicitGCInvokesConcurrent
    -XX:+HeapDumpOnOutOfMemoryError
    -XX:+ExitOnOutOfMemoryError
    -Djava.security.egd=file:/dev/urandom
  config.properties: |
    coordinator=true
    node-scheduler.include-coordinator=true
    http-server.http.port=8080
    discovery.uri=http://localhost:8080
    query.max-memory=3GB
    query.max-memory-per-node=1GB
    query.max-run-time=30m
  iceberg.properties: |
    connector.name=iceberg
    iceberg.catalog.type=rest
    iceberg.rest-catalog.uri=http://nessie.catalog.svc:19120/iceberg
    iceberg.rest-catalog.warehouse=warehouse
    iceberg.register-table-procedure.enabled=true
    fs.s3.enabled=true
    s3.endpoint=${ENV:S3_ENDPOINT}
    s3.path-style-access=true
    s3.aws-access-key=${ENV:S3_ACCESS_KEY}
    s3.aws-secret-key=${ENV:S3_SECRET_KEY}
    s3.region=us-east-1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trino
  namespace: trino
  labels:
    app: trino
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trino
  template:
    metadata:
      labels:
        app: trino
    spec:
      containers:
        - name: trino
          image: ${IMAGE_TRINO}
          env:
            - name: S3_ENDPOINT
              value: http://seaweedfs-s3.storage.svc:8333
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: lakehouse-s3
                  key: access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: lakehouse-s3
                  key: secret-key
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /v1/info
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/info
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 4Gi
          volumeMounts:
            - name: config
              mountPath: /etc/trino
              readOnly: true
            - name: data
              mountPath: /data/trino
      volumes:
        - name: config
          configMap:
            name: trino-config
            items:
              - key: node.properties
                path: node.properties
              - key: jvm.config
                path: jvm.config
              - key: config.properties
                path: config.properties
              - key: iceberg.properties
                path: catalog/iceberg.properties
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: trino
  namespace: trino
spec:
  selector:
    app: trino
  ports:
    - name: http
      port: 8080
      targetPort: http
