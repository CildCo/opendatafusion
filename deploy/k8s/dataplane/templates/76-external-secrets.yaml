# Optional. Apply only when External Secrets Operator is installed and a
# ClusterSecretStore exists; otherwise skip this file and let install.sh keep
# generating the secrets.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: lakehouse-s3
  namespace: storage
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ${ESO_STORE}
    kind: ClusterSecretStore
  target:
    name: lakehouse-s3
  data:
    - secretKey: access-key
      remoteRef:
        key: ${ESO_PREFIX}/s3-access-key
    - secretKey: secret-key
      remoteRef:
        key: ${ESO_PREFIX}/s3-secret-key
---
