apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-config
  namespace: stream
data:
  server.properties: |
    process.roles=broker,controller
    node.id=1
    controller.quorum.voters=1@localhost:9093
    listeners=PLAINTEXT://:9092,CONTROLLER://:9093
    advertised.listeners=PLAINTEXT://kafka.stream.svc.cluster.local:9092
    controller.listener.names=CONTROLLER
    listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
    inter.broker.listener.name=PLAINTEXT
    log.dirs=/var/lib/kafka/data
    num.partitions=3
    default.replication.factor=1
    offsets.topic.replication.factor=1
    transaction.state.log.replication.factor=1
    transaction.state.log.min.isr=1
    auto.create.topics.enable=true
    log.retention.hours=168
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kafka-data
  namespace: stream
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: ${KAFKA_SIZE}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: stream
  labels:
    app: kafka
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: ${IMAGE_KAFKA}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              if [ ! -f /var/lib/kafka/data/meta.properties ]; then
                /opt/kafka/bin/kafka-storage.sh format \
                  -t "${KAFKA_CLUSTER_ID}" -c /opt/odf-kafka/server.properties
              fi
              exec /opt/kafka/bin/kafka-server-start.sh /opt/odf-kafka/server.properties
          ports:
            - name: plaintext
              containerPort: 9092
            - name: controller
              containerPort: 9093
          readinessProbe:
            tcpSocket:
              port: plaintext
            initialDelaySeconds: 20
            periodSeconds: 10
          startupProbe:
            tcpSocket:
              port: plaintext
            failureThreshold: 30
            periodSeconds: 5
          resources:
            requests:
              cpu: 300m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /opt/odf-kafka
              readOnly: true
            - name: data
              mountPath: /var/lib/kafka/data
      volumes:
        - name: config
          configMap:
            name: kafka-config
        - name: data
          persistentVolumeClaim:
            claimName: kafka-data
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: stream
spec:
  selector:
    app: kafka
  ports:
    - name: plaintext
      port: 9092
      targetPort: plaintext
