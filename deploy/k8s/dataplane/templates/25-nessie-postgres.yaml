# Backs the Nessie version store. Without it the catalog lives in memory and a
# restart loses every table reference.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nessie-postgres-data
  namespace: catalog
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: ${NESSIE_PG_SIZE}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nessie-postgres
  namespace: catalog
  labels:
    app: nessie-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nessie-postgres
  template:
    metadata:
      labels:
        app: nessie-postgres
    spec:
      containers:
        - name: postgres
          image: ${IMAGE_POSTGRES}
          env:
            - name: POSTGRES_DB
              value: nessie
            - name: POSTGRES_USER
              value: nessie
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nessie-postgres
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "nessie", "-d", "nessie"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nessie-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: nessie-postgres
  namespace: catalog
spec:
  selector:
    app: nessie-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
