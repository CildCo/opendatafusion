apiVersion: v1
kind: Service
metadata:
  name: {{ include "odf.fullname" . }}-api
  labels:
    {{- include "odf.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "odf.selector" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - {name: http, port: 18080, targetPort: http}
