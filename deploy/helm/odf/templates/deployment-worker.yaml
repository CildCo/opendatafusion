apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "odf.fullname" . }}-worker
  labels:
    {{- include "odf.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "odf.selector" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "odf.selector" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: {{ include "odf.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{ toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "odf.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{ toYaml .Values.securityContext | nindent 12 }}
          envFrom:
            - configMapRef: {name: {{ include "odf.fullname" . }}-config}
            - secretRef: {name: {{ include "odf.secretName" . }}}
          env:
            - {name: ODF_ROLE, value: worker}
          resources: {{ toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            - {name: files, mountPath: /data/odf/files}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: files
        {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "odf.filesClaim" . }}
        {{- else }}
          emptyDir: {}
        {{- end }}
        - name: tmp
          emptyDir: {}
