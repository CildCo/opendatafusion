apiVersion: v1
kind: Service
metadata:
  name: {{ include "odf.fullname" . }}-mcp
  labels:
    {{- include "odf.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "odf.selector" . | nindent 4 }}
    app.kubernetes.io/component: mcp
  ports:
    - {name: mcp, port: 18082, targetPort: mcp}
