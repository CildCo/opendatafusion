apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "odf.fullname" . }}-config
  labels:
    {{- include "odf.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  ODF_FILE_DIR: /data/odf/files
  ODF_FILE_SOURCE_ROOTS: /data/odf/files
  {{- range $key, $value := .Values.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
