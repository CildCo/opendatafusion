[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "odf"
version = "1.0.0"
description = "API-first open-source low-code data platform for the full data delivery loop"
license = {text = "Apache-2.0"}
readme = "README.md"
authors = [{name = "OpenDataFusion Contributors"}]
keywords = ["data platform", "etl", "low-code", "data governance", "fastapi", "postgresql"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Framework :: FastAPI",
  "Database :: PostgreSQL",
  "Topic :: Database",
  "Topic :: Software Development :: Libraries",
]
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.54.0", "sqlalchemy>=2.1.6",
  "alembic>=1.13", "pydantic>=2.6", "pydantic-settings>=2.2", "psycopg[binary]>=3.1",
  "apscheduler>=3.11.3", "pymysql>=1.1", "python-jose[cryptography]>=3.3", "bcrypt>=4",
  "httpx>=0.28.1", "python-multipart>=0.0.9", "openpyxl>=3.1", "cryptography>=50.0.2", "mcp>=2", "duckdb>=1.0", "pyarrow>=26.0.1",
  "oracledb>=2.0", "pymssql>=2.3", "clickhouse-connect>=1.13.0",
  "duckdb-engine>=0.17", "pymongo>=4.6", "kafka-python-ng>=2.2.3",
  "pyhive>=0.7", "thrift>=0.16", "dmPython>=2.6.1", "sshtunnel>=0.4", "graphql-core>=3.2", "sqlglot>=25"]

[project.urls]
Homepage = "https://github.com/CildCo/opendatafusion"
Repository = "https://github.com/CildCo/opendatafusion"
Issues = "https://github.com/CildCo/opendatafusion/issues"
Changelog = "https://github.com/CildCo/opendatafusion/blob/main/CHANGELOG.md"
Documentation = "https://github.com/CildCo/opendatafusion/tree/main/docs"

[project.optional-dependencies]
dev = ["pytest>=9.2.0", "pyyaml>=6.0.3"]
ldap = ["ldap3>=2.9.1"]
files-s3 = ["boto3>=1.43.115"]
metrics = ["prometheus-client>=0.26.0"]
otel = ["opentelemetry-sdk>=1.45.1", "opentelemetry-exporter-otlp>=1.45.1",
  "opentelemetry-instrumentation-fastapi>=0.45b0",
  "opentelemetry-instrumentation-httpx>=0.66b2"]

[project.scripts]
odf = "odf.cli:main"

[tool.setuptools.packages.find]
include = ["odf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs an explicit test database (ODF_TEST_DATABASE_URL)"]
