[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "odf"
version = "1.0.0"
description = "API-first open-source low-code data platform for the full data delivery loop"
license = {text = "Apache-2.0"}
readme = "README.md"
authors = [{name = "OpenDataFusion Contributors"}]
keywords = ["data platform", "etl", "low-code", "data governance", "fastapi", "postgresql"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Framework :: FastAPI",
  "Database :: PostgreSQL",
  "Topic :: Database",
  "Topic :: Software Development :: Libraries",
]
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "sqlalchemy>=2.0",
  "alembic>=1.13", "pydantic>=2.6", "pydantic-settings>=2.2", "psycopg[binary]>=3.1",
  "apscheduler>=3.10", "pymysql>=1.1", "python-jose[cryptography]>=3.3", "bcrypt>=4",
  "httpx>=0.27", "python-multipart>=0.0.9", "openpyxl>=3.1", "cryptography>=42", "mcp>=2", "duckdb>=1.0", "pyarrow>=16",
  "oracledb>=2.0", "pymssql>=2.3", "clickhouse-connect>=0.7"]

[project.urls]
Homepage = "https://github.com/CildCo/opendatafusion"
Repository = "https://github.com/CildCo/opendatafusion"
Issues = "https://github.com/CildCo/opendatafusion/issues"
Changelog = "https://github.com/CildCo/opendatafusion/blob/main/CHANGELOG.md"
Documentation = "https://github.com/CildCo/opendatafusion/tree/main/docs"

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml>=6"]
ldap = ["ldap3>=2.9"]
files-s3 = ["boto3>=1.34"]
metrics = ["prometheus-client>=0.20"]
otel = ["opentelemetry-sdk>=1.24", "opentelemetry-exporter-otlp>=1.24",
  "opentelemetry-instrumentation-fastapi>=0.45b0",
  "opentelemetry-instrumentation-httpx>=0.45b0"]

[project.scripts]
odf = "odf.cli:main"

[tool.setuptools.packages.find]
include = ["odf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs an explicit test database (ODF_TEST_DATABASE_URL)"]
